<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Mint</title>
<meta name="description" content="Diseña tokens imprimibles en 3D para tu grupo de Blood on the Clocktower. Una herramienta gratuita hecha por la comunidad.">
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
<!-- Wordmark "Grimorio": the blackletter face is only used for "Midnight", so load just those letters. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=Midnight&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app" id="app" hidden>

  <!-- editions -->
  <nav class="spine" id="spine" data-i18n-attr="aria-label:spine.aria">
    <div class="brand"><img src="/logo-mark.svg" alt="" width="44" height="44"><span class="wordmark"><span class="wm-mid">Midnight</span><span class="wm-mint">Mint</span></span></div>
    <div id="editions"></div>
    <div class="account">
      <details class="lang-menu" data-lang-menu></details>
      <button type="button" class="admin-sign-in" id="adminSignIn" hidden data-i18n="gate.signIn"></button>
      <details class="me" hidden>
        <summary data-i18n-attr="aria-label:me.aria"><img id="avatar" alt="" referrerpolicy="no-referrer"></summary>
        <div class="menu">
          <p id="meEmail"></p>
          <button type="button" id="openAdmin" hidden data-i18n="me.admin"></button>
          <button type="button" id="signOut" data-i18n="me.signOut"></button>
        </div>
      </details>
    </div>
    <footer class="ccc">
      <img src="/ccc-sleeve.png" alt="Community Created Content" width="86" height="34">
      <p><span data-i18n="ccc.short"></span> <a href="#" data-credits data-i18n="credits.link"></a></p>
    </footer>
  </nav>

  <!-- script sheet -->
  <main class="sheet" id="sheet">
    <header class="sheet-head">
      <div class="sheet-title">
        <h1 id="edTitle"></h1>
        <div class="take-all" id="takeAll">
          <button class="pill" type="button" id="addShownChars"></button>
          <button class="pill" type="button" id="addShownAll"></button>
        </div>
      </div>
      <div class="sheet-sub">
        <p id="edLead" class="lead"></p>
        <button class="tlang-trigger" id="tokenLangBtn" type="button" aria-haspopup="dialog"></button>
      </div>
      <div class="filters">
        <input type="search" id="search" class="search" autocomplete="off" data-i18n-attr="placeholder:sheet.search aria-label:sheet.search">
        <div class="chips" id="teamChips" role="group" data-i18n-attr="aria-label:tray.team"></div>
      </div>
    </header>
    <div id="rows"></div>
  </main>

  <!-- workshop -->
  <aside class="workshop" id="workshop">
    <div class="ws-top">
      <button class="pill ws-close" type="button" id="wsClose" data-i18n="ws.close"></button>
    </div>
    <div class="stage-wrap">
    <div class="stage">
      <canvas id="view" data-i18n-attr="aria-label:view.aria"></canvas>
      <div class="turn" role="group" data-i18n-attr="aria-label:view.group">
        <button class="pill" type="button" data-view="angle" aria-pressed="true" data-i18n="view.angle"></button>
        <button class="pill" type="button" data-view="top" aria-pressed="false" data-i18n="view.front"></button>
        <button class="pill" type="button" data-view="back" aria-pressed="false" data-i18n="view.back"></button>
        <button class="pill" type="button" id="xray" aria-pressed="false" hidden data-i18n="view.xray" data-i18n-attr="title:view.xrayHelp"></button>
      </div>
    </div>
    </div>
    <div class="caption">
      <h2 id="name">&nbsp;</h2>
      <p id="sub"></p>
    </div>
    <div class="ws-actions">
      <button class="forge" id="enqueue" type="button"></button>
      <button class="pill" id="download" type="button" data-i18n="act.stl"></button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" type="button" data-tab="set" aria-selected="true" data-i18n="ws.set"></button>
      <button role="tab" type="button" data-tab="token" aria-selected="false" data-i18n="ws.token"></button>
      <button role="tab" type="button" data-tab="saved" aria-selected="false"><span data-i18n="ws.saved"></span> <small id="savedSummary"></small></button>
    </div>
    <div class="ws-body">
      <!-- shared style controls: edit the set style, or this token's own style -->
      <section id="styleControls">
        <div class="presets" id="presetsBox">
          <p class="presets-title" data-i18n="presets.title"></p>
          <div class="preset-list" id="presets"></div>
        </div>
        <p class="hint" id="styleScope"></p>
        <div class="token-only" id="tokenOnly">
          <label class="field"><span data-i18n="ws.printedText"></span><input class="text" type="text" id="printed" autocomplete="off"></label>
          <label class="check" id="femRow" hidden><input type="checkbox" id="fem"> <span id="femLabel"></span></label>
          <label class="check"><input type="checkbox" id="ownStyle"> <span data-i18n="ws.ownStyle"></span></label>
          <button class="link" type="button" id="resetToken" data-i18n="ws.reset"></button>
        </div>
        <fieldset id="styleFields">
          <details open>
            <summary><span data-i18n="sec.style"></span> <small id="styleSummary"></small></summary>
            <div class="rows">
              <div class="choices" data-choice="style"></div>
              <div class="choices" data-choice="windowFinish" id="windowFinishRow"></div>
              <p class="hint" id="styleHint"></p>
              <div class="row" id="windowDepthRow"><label for="windowDepth" data-i18n="range.windowDepth"></label><output data-for="windowDepth"></output><input type="range" id="windowDepth" min="0.4" max="1.6" step="0.2" value="0.8"></div>
            </div>
          </details>
          <details>
            <summary><span data-i18n="sec.name"></span> <small id="nameSummary"></small></summary>
            <div class="rows">
              <p class="hint" id="nameHint"></p>
              <div class="row"><label for="textSize" data-i18n="range.textSize"></label><output data-for="textSize"></output><input type="range" id="textSize" min="2" max="6" step="0.1" value="4"></div>
              <div class="row"><label for="spacing" data-i18n="range.spacing"></label><output data-for="spacing"></output><input type="range" id="spacing" min="0.8" max="2" step="0.05" value="1.1"></div>
              <div class="row"><label for="maxArc" data-i18n="range.maxArc"></label><output data-for="maxArc"></output><input type="range" id="maxArc" min="90" max="240" step="5" value="180"></div>
            </div>
          </details>
          <details>
            <summary><span data-i18n="sec.frame"></span> <small id="frameSummary"></small></summary>
            <div class="rows">
              <div class="choices" data-choice="frame"></div>
              <div class="row"><label for="frameWidth" data-i18n="range.frameWidth"></label><output data-for="frameWidth"></output><input type="range" id="frameWidth" min="0.4" max="2" step="0.1" value="0.8"></div>
              <div class="metal" data-colour="frame" data-i18n-attr="aria-label:frame.aria"></div>
            </div>
          </details>
          <details>
            <summary><span data-i18n="sec.back"></span> <small id="backSummary"></small></summary>
            <div class="rows">
              <div class="choices" data-choice="back"></div>
              <input type="file" id="upload" accept=".svg,image/svg+xml" hidden data-i18n-attr="aria-label:upload.aria">
              <p class="hint" id="uploadHint" hidden></p>
              <div class="metal" data-colour="back" data-i18n-attr="aria-label:back.aria"></div>
            </div>
          </details>
          <details>
            <summary><span data-i18n="sec.magnet"></span> <small id="magnetSummary"></small></summary>
            <div class="rows">
              <div class="choices" data-choice="magnet"></div>
              <div class="choices" data-choice="magnetSize" id="magnetSizeRow"></div>
              <p class="hint" id="magnetHint"></p>
            </div>
          </details>
          <details>
            <summary><span data-i18n="sec.coin"></span> <small id="coinSummary"></small></summary>
            <div class="rows">
              <p class="metal-label" data-i18n="coin.colour"></p>
              <div class="metal" data-colour="base" data-i18n-attr="aria-label:coin.colour"></div>
              <div class="row"><label for="diameter" data-i18n="range.diameter"></label><output data-for="diameter"></output><input type="range" id="diameter" min="30" max="60" step="1" value="45"></div>
              <div class="row"><label for="height" data-i18n="range.height"></label><output data-for="height"></output><input type="range" id="height" min="1.2" max="4" step="0.2" value="2"></div>
              <div class="row"><label for="depth" data-i18n="range.depth"></label><output data-for="depth"></output><input type="range" id="depth" min="0.2" max="1.6" step="0.2" value="0.2"></div>
              <p class="hint" id="depthHint"></p>
              <div class="row"><label for="iconScale" data-i18n="range.iconScale"></label><output data-for="iconScale"></output><input type="range" id="iconScale" min="0.6" max="1.2" step="0.05" value="1"></div>
            </div>
          </details>
        </fieldset>
      </section>
      <section id="savedPanel" hidden>
        <button class="pill" type="button" id="save" data-i18n="act.save"></button>
        <p class="hint" id="saveNote" data-i18n="saved.help"></p>
        <ul class="list" id="saved"></ul>
      </section>
    </div>
    <p class="hint note" id="exportNote"></p>
  </aside>

  <!-- queue -->
  <footer class="queuebar" id="queuebar">
    <button class="qb-toggle" type="button" id="queueToggle" aria-expanded="false" aria-controls="queuePanel">
      <span class="stack" id="queueStack"></span>
      <span id="queueCount"></span>
    </button>
    <p class="hint" id="queuePlan"></p>
    <button class="pill" id="pdf" type="button" disabled data-i18n="queue.pdf" data-i18n-attr="title:queue.pdfTip"></button>
    <button class="forge" id="bambu" type="button" disabled data-i18n="queue.download"></button>
  </footer>
  <section class="queue-panel" id="queuePanel" hidden>
    <div class="qp-head">
      <h2 data-i18n="sec.queue"></h2>
      <div class="import">
        <label class="pill file"><span data-i18n="queue.import"></span><input type="file" id="scriptFile" accept="application/json,.json" hidden></label>
        <button class="pill" type="button" id="pasteToggle" aria-expanded="false" data-i18n="queue.paste"></button>
        <button class="pill" id="queueClear" type="button" hidden data-i18n="queue.clear"></button>
      </div>
    </div>
    <div class="paste" id="pasteBox" hidden>
      <textarea class="text" id="scriptText" rows="3" placeholder='[{"id":"_meta","name":"…"},"washerwoman","librarian",…]' data-i18n-attr="aria-label:queue.pasteAria"></textarea>
      <button class="pill" type="button" id="pasteImport" data-i18n="queue.pasteImport"></button>
    </div>
    <label class="check"><input type="checkbox" id="withReminders"> <span data-i18n="queue.withReminders"></span></label>
    <p class="hint" id="importNote" data-i18n="queue.importHelp"></p>
    <ul class="list grid" id="queue"></ul>
  </section>
</div>

<div class="gate" id="gate">
  <details class="lang-menu gate-langs" data-lang-menu hidden></details>
  <div class="gate-card">
    <img class="gate-logo" src="/logo-mark.svg" alt="" width="88" height="88">
    <p class="mark wordmark"><span class="wm-mid">Midnight</span><span class="wm-mint">Mint</span></p>
    <h2 id="gateTitle">Abriendo el grimorio…</h2>
    <p id="gateText"></p>
    <button class="forge" type="button" id="gateAction" hidden></button>
    <button class="pill" type="button" id="gateSecondary" hidden></button>
    <footer class="ccc">
      <img src="/ccc-sleeve.png" alt="Community Created Content" width="86" height="34">
      <p id="gateCcc" data-i18n="ccc.gate">Herramienta gratuita hecha por la comunidad para imprimir tus propios tokens de personaje. No está afiliada ni respaldada por The Pandemonium Institute.</p>
    </footer>
  </div>
</div>
<script>
  // Shown before the app code has loaded: switch the loading screen to English if that's the saved language.
  try {
    if (localStorage.getItem("midnight-mint-lang") === "en") {
      document.documentElement.lang = "en";
      document.getElementById("gateTitle").textContent = "Opening the grimoire…";
      document.getElementById("gateCcc").textContent = "A free, community-made tool for printing your own character tokens. Not affiliated with or endorsed by The Pandemonium Institute.";
    }
  } catch (e) { /* no storage */ }
</script>

<dialog id="credits" aria-labelledby="creditsTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="creditsTitle" data-i18n="credits.title"></h2>
  <div class="credits" id="creditsBody"></div>
</dialog>

<dialog id="tlangDialog" class="tlang-dialog" aria-labelledby="tlangTitle">
  <div class="tl-head">
    <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
    <h2 id="tlangTitle" data-i18n="tlang.title"></h2>
    <p class="hint" data-i18n="tlang.intro"></p>
  </div>
  <div class="tl-split">
    <div class="tl-list" id="tlangList" role="listbox" data-i18n-attr="aria-label:tlang.title"></div>
    <div class="tl-stage" id="tlangStage" aria-live="polite"></div>
  </div>
  <div class="tl-foot">
    <button class="pill" type="button" id="tlangCancel" data-i18n="tlang.cancel"></button>
    <button class="forge" type="button" id="tlangUse"></button>
  </div>
</dialog>

<dialog id="admin" aria-labelledby="adminTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="adminTitle" data-i18n="admin.title"></h2>
  <section>
    <h3 data-i18n="admin.library"></h3>
    <p class="hint" id="libraryState"></p>
    <div class="import">
      <label class="pill file"><span data-i18n="admin.uploadRoles"></span><input type="file" id="libraryFile" accept="application/json,.json" hidden></label>
    </div>
  </section>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
