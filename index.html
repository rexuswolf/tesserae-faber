<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesserae Faber</title>
<meta name="description" content="Design tokens for your games and download them ready to print in 3D or on paper. Includes every Blood on the Clocktower edition. Free, no account.">
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg" id="favicon">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="theme-color" content="#1c1a18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Gloock&family=Marcellus&family=Instrument+Sans:wght@400;500;600&display=swap">
<!-- Wordmark "Grimorio": the blackletter face is only used for "Midnight", so load just those letters. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=Midnight&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app" id="app" hidden>

  <!-- top bar: the three steps (pick, design, print) and the language (the interface and the tokens) -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" type="button" id="drawerOpen" aria-controls="spine" aria-expanded="false" data-i18n-attr="aria-label:top.menu">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <!-- the collection is the brand (Clocktower at /botc too): its menu goes to the other collections and, for one
         of your own, to its settings -->
    <div class="coll-switch">
      <button type="button" id="collSwitch" aria-haspopup="menu" aria-expanded="false" aria-controls="collMenu"><img class="coll-logo" src="/tesserae-faber-small.svg" alt="" width="34" height="34"><span class="cs-text"><b class="coll-name"></b><small>Tesserae Faber</small></span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="coll-menu" id="collMenu" role="menu" hidden>
        <a class="coll-back" role="menuitem" href="/colecciones"><span aria-hidden="true">‹</span><b data-i18n="own.homeTitle"></b><small data-i18n="own.menuBack"></small></a>
        <hr class="built-only">
        <button class="built-only" role="menuitem" type="button" data-coll="copy"><span aria-hidden="true">⧉</span><b data-i18n="own.copy"></b><small data-i18n="own.menuCopy"></small></button>
        <hr class="own-only">
        <button class="own-only" role="menuitem" type="button" data-coll="settings"><span aria-hidden="true">⚙</span><b data-i18n="own.settings"></b><small data-i18n="own.menuSettings"></small></button>
        <button class="own-only" role="menuitem" type="button" data-coll="groups"><span aria-hidden="true">◐</span><b data-i18n="own.groups"></b><small data-i18n="own.menuGroups"></small></button>
        <hr class="own-only">
        <button class="own-only" role="menuitem" type="button" data-coll="import"><span aria-hidden="true">⇩</span><b data-i18n="own.import"></b><small data-i18n="own.menuImport"></small></button>
        <button class="own-only" role="menuitem" type="button" data-coll="export"><span aria-hidden="true">⇧</span><b data-i18n="own.export"></b><small data-i18n="own.menuExport"></small></button>
        <input type="file" id="ownImportFile" accept="application/json,.json" hidden>
        <p class="hint warn" id="ownNote" aria-live="polite"></p>
      </div>
    </div>
    <nav class="flow-steps" id="flowSteps" data-i18n-attr="aria-label:flow.aria"></nav>
    <button class="tlang-trigger" id="tokenLangBtn" type="button" aria-haspopup="dialog" data-lang-open></button>
  </header>

  <!-- the sidebar: editions (more groups, like scripts, can join them), then the guide, the admin and the credits.
       On a phone it is a drawer. -->
  <nav class="spine" id="spine" data-i18n-attr="aria-label:spine.aria">
    <div class="spine-scroll">
      <!-- on a phone: the collection and its menu head the drawer (the top bar has no room) -->
      <details class="own-drawer">
        <summary><img class="coll-logo" src="/tesserae-faber-small.svg" alt="" width="34" height="34"><span class="cs-text"><b class="coll-name"></b><small data-i18n="own.switchColl"></small></span><span class="chev" aria-hidden="true">▾</span></summary>
        <div class="coll-fold"><div class="coll-menu-items">
        <a class="coll-back" role="menuitem" href="/colecciones"><span aria-hidden="true">‹</span><b data-i18n="own.homeTitle"></b><small data-i18n="own.menuBack"></small></a>
        <hr class="built-only">
        <button class="built-only" role="menuitem" type="button" data-coll="copy"><span aria-hidden="true">⧉</span><b data-i18n="own.copy"></b><small data-i18n="own.menuCopy"></small></button>
        <hr class="own-only">
        <button class="own-only" role="menuitem" type="button" data-coll="settings"><span aria-hidden="true">⚙</span><b data-i18n="own.settings"></b><small data-i18n="own.menuSettings"></small></button>
        <button class="own-only" role="menuitem" type="button" data-coll="groups"><span aria-hidden="true">◐</span><b data-i18n="own.groups"></b><small data-i18n="own.menuGroups"></small></button>
        <hr class="own-only">
        <button class="own-only" role="menuitem" type="button" data-coll="import"><span aria-hidden="true">⇩</span><b data-i18n="own.import"></b><small data-i18n="own.menuImport"></small></button>
        <button class="own-only" role="menuitem" type="button" data-coll="export"><span aria-hidden="true">⇧</span><b data-i18n="own.export"></b><small data-i18n="own.menuExport"></small></button>
        </div></div>
      </details>
      <hr class="spine-rule own-drawer-rule">
      <!-- every character, and the grimoire's info tokens: above the editions -->
      <div id="library"></div>
      <hr class="spine-rule">
      <div class="spine-h spine-sec own-spine-h"><h2 data-i18n="spine.editions"></h2>
        <button class="spine-add own-only" type="button" id="catalogNew" data-i18n-attr="aria-label:own.newCatalog title:own.newCatalog">+</button></div>
      <div id="editions"></div>
      <div class="spine-h spine-sec botc-only"><h2 data-i18n="spine.scripts"></h2>
        <button class="spine-add" type="button" id="scriptNew" data-i18n-attr="aria-label:script.new title:script.new">+</button></div>
      <div id="scripts" class="botc-only"></div>
    </div>
    <footer class="spine-foot">
    <!-- the guide, with the admin beside it (signed in, or ?admin to sign in); under them, about the tool and its
         credits (with the Community Created Content mark, where it applies). The language is at the top right. -->
    <div class="foot-row">
      <button class="guide-btn" type="button" data-guide aria-haspopup="dialog"><span class="q" aria-hidden="true">?</span><span data-i18n="guide.open"></span></button>
      <button type="button" class="admin-sign-in" id="adminSignIn" hidden data-i18n="gate.signIn"></button>
      <details class="me" hidden>
        <summary data-i18n-attr="aria-label:me.aria"><img id="avatar" alt="" referrerpolicy="no-referrer"><span data-i18n="me.adminLabel"></span></summary>
        <div class="menu">
          <p id="meEmail"></p>
          <button type="button" id="openAdmin" hidden data-i18n="me.admin"></button>
          <button type="button" id="signOut" data-i18n="me.signOut"></button>
        </div>
      </details>
    </div>
    <a href="#" class="about-link" data-about data-i18n="about.link"></a>
    </footer>
  </nav>
  <div class="scrim" id="scrim"></div>

  <!-- script sheet -->
  <main class="sheet" id="sheet">
    <header class="sheet-head">
      <!-- what's shown, and the one way to add it to the queue -->
      <div class="head-row">
        <div class="head-text">
          <div class="sheet-title">
            <h1 id="edTitle"></h1>
          </div>
          <p id="edLead" class="lead"></p>
        </div>
        <div class="addmenu" id="addWrap">
          <button class="pill add main" type="button" id="addBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="addMenu"><svg class="gi plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span id="addLabel"></span><svg class="gi chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="menu" id="addMenu" role="menu" aria-labelledby="addBtn" hidden></div>
        </div>
      </div>
      <div class="script-actions" id="scriptActions" hidden>
        <button class="pill" type="button" id="scriptShare"></button>
        <button class="pill" type="button" id="scriptJson" data-i18n="script.json"></button>
        <button class="pill danger" type="button" id="scriptDelete" data-i18n="script.delete"></button>
        <p class="hint" id="scriptNote" aria-live="polite"></p>
        <p class="hint warn" id="scriptCustomWarn" data-i18n="script.customWarn" hidden></p>
      </div>
      <div class="own-actions own-only" id="ownActions" hidden>
        <button class="pill add" type="button" id="ownNewTok" data-i18n="own.newToken"></button>
        <button class="pill" type="button" id="ownCatList" data-i18n="own.addFromList"></button>
        <button class="pill" type="button" id="ownCatRename" data-i18n="own.renameCatalog"></button>
        <button class="pill danger" type="button" id="ownCatDelete" data-i18n="own.deleteCatalog"></button>
      </div>
      <!-- what only narrows the list -->
      <div class="filters">
        <span class="eyebrow"><svg class="gi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span data-i18n="filter.label"></span></span>
        <div class="filter-row">
          <label class="search-box"><svg class="gi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input type="search" id="search" class="search" autocomplete="off" data-i18n-attr="placeholder:sheet.search aria-label:sheet.search"></label>
          <div class="chips" id="teamChips" role="group" data-i18n-attr="aria-label:tray.team"></div>
        </div>
      </div>
    </header>
    <div id="rows"></div>
  </main>

  <!-- workshop: one editor for making and changing a token. On top its shape and the style it uses;
       then its parts (a coin's FRONT · BACK · COIN · MAGNET). FRONT and BACK say first what the token
       says (its own) and then how it looks (its style's, or its own changes). -->
  <aside class="workshop" id="workshop">
    <div class="ws-head">
      <div class="ws-shape" id="shapeRow"></div>
      <div class="ws-style" id="styleRow">
        <span class="ws-style-l" data-i18n="style.label"></span>
        <button class="style-chip" type="button" id="styleChip" aria-haspopup="menu" aria-expanded="false" aria-controls="styleMenu"></button>
        <small id="styleCount"></small>
        <button class="own-mark" type="button" id="styleBack" hidden></button>
        <div class="menu style-menu" id="styleMenu" role="menu" hidden></div>
      </div>
    </div>
    <!-- the token's parts: a coin's FRONT · BACK · COIN · MAGNET, a ring's FRONT · RING, a card's FRONT · CARD -->
    <div class="parts" id="parts" role="tablist" data-i18n-attr="aria-label:ws.sections" hidden></div>
    <div class="ws-body" id="styleFields">
      <!-- what the token says: always its own, whatever its style -->
      <section class="ws-content" id="contentBlock" hidden>
        <h3 class="ws-bh"><span id="contentTitle"></span> <small data-i18n="content.only"></small></h3>
        <!-- a token of your collection: its name, icon, group, catalogs and linked tokens -->
        <div class="own-fields" id="contentOwn" hidden>
          <label class="field"><span data-i18n="own.name"></span><input class="text" id="ownTokName" autocomplete="off" data-i18n-attr="placeholder:own.namePlaceholder"></label>
          <div class="field" id="ownTokIconRow"><span data-i18n="own.icon"></span>
            <div class="own-icon-bar">
              <input class="text" type="search" id="ownTokIq" autocomplete="off" data-i18n-attr="placeholder:icon.placeholder">
              <label class="pill file"><span data-i18n="icon.upload"></span><input type="file" id="ownTokSvg" accept=".svg,image/svg+xml" hidden></label>
              <button class="pill" type="button" id="ownTokNoIcon" data-i18n="own.noIcon"></button>
            </div>
            <div class="icon-results" id="ownTokHits"></div>
          </div>
          <div class="field"><span data-i18n="own.group"></span><div class="group-pills" id="ownTokGroups"></div></div>
          <div class="field" id="ownTokCatsRow"><span data-i18n="own.inCatalogs"></span><div class="own-cats" id="ownTokCats"></div></div>
          <div class="field"><span data-i18n="own.linked"></span><p class="hint" data-i18n="own.linkedHelp"></p>
            <div class="own-linked" id="ownTokLinked"></div>
            <button class="link" type="button" id="ownTokAddLinked" data-i18n="own.addLinked"></button>
          </div>
          <p><button class="pill danger" type="button" id="ownTokDelete" data-i18n="own.deleteToken"></button></p>
        </div>
        <!-- a token of Clocktower's or of a closed collection, or a linked token: its printed text, feminine name and icon -->
        <div class="token-only" id="contentClosed" hidden>
          <label class="field"><span data-i18n="ws.printedText"></span><input class="text" type="text" id="printed" autocomplete="off"></label>
          <label class="check" id="femRow" hidden><input type="checkbox" id="fem"> <span id="femLabel"></span></label>
          <div class="field icon-field" id="iconField">
            <span data-i18n="icon.label"></span>
            <div class="icon-actions">
              <button class="pill" type="button" id="iconSearchOpen" data-i18n="icon.search"></button>
              <button class="pill" type="button" id="iconUpload" data-i18n="icon.upload"></button>
              <button class="link" type="button" id="iconReset" data-i18n="icon.reset" hidden></button>
            </div>
            <input type="file" id="iconFile" accept=".svg,image/svg+xml" hidden>
            <p class="hint" id="iconHint"></p>
            <div class="icon-search" id="iconSearch" hidden>
              <input class="text" type="search" id="iconQuery" autocomplete="off" data-i18n-attr="placeholder:icon.placeholder">
              <div class="icon-results" id="iconResults"></div>
            </div>
          </div>
        </div>
        <!-- the other state, on the back (a coin's): added, named, given an icon, taken away -->
        <div class="own-fields" id="contentFlip" hidden>
          <p class="hint" data-i18n="own.flipHelp"></p>
          <button class="pill" type="button" id="ownTokFlipAdd" data-i18n="own.flipAdd"></button>
          <div class="own-flip" id="ownTokFlipBox" hidden>
            <label class="field"><span data-i18n="own.flipName"></span><input class="text" id="ownTokFlipName" autocomplete="off"></label>
            <div class="field"><span data-i18n="own.flipIcon"></span>
              <div class="own-icon-bar">
                <input class="text" type="search" id="ownTokFlipIq" autocomplete="off" data-i18n-attr="placeholder:icon.placeholder">
                <label class="pill file"><span data-i18n="icon.upload"></span><input type="file" id="ownTokFlipSvg" accept=".svg,image/svg+xml" hidden></label>
                <button class="pill" type="button" id="ownTokFlipNoIcon" data-i18n="own.noIcon"></button>
              </div>
              <div class="icon-results" id="ownTokFlipHits"></div>
            </div>
            <button class="link" type="button" id="ownTokFlipRemove" data-i18n="own.flipRemove"></button>
          </div>
        </div>
        <p class="hint" id="contentNote" hidden></p>
      </section>
      <!-- how it looks: from its style -->
      <h3 class="ws-bh" id="lookHead"><span id="lookTitle"></span> <small id="lookSub"></small></h3>
      <div class="scope-box" id="scopeNote" aria-live="polite" hidden></div>
      <div class="ws-warn" id="colourWarn" hidden></div>
      <div class="back-modes" id="backModes" hidden></div>
      <div class="face-tabs" id="faceTabs" role="tablist" data-i18n-attr="aria-label:ws.faceTabs" hidden></div>
      <!-- the collection's styles: the token's style can be set back to one -->
      <section class="ws-panel coll-styles" data-panel="reset">
        <p class="reset-head"><b id="resetTitle"></b> <button class="link" type="button" id="resetCancel" data-i18n="script.cancel"></button></p>
        <div class="coll-style-list" id="resetList"></div>
        <p class="hint" data-i18n="style.resetHelp"></p>
      </section>
      <!-- a face (the front, or a back of its own): its layout, name, icon and frame, each part flush or raised -->
      <section class="ws-panel" data-panel="layout" role="tabpanel" hidden>
        <div class="choices layout-tiles" data-choice="style"></div>
        <p class="hint" id="styleHint"></p>
      </section>
      <section class="ws-panel" data-panel="text" role="tabpanel" hidden>
        <p class="hint" id="nameHint"></p>
        <div class="row"><label for="textSize" data-i18n="range.textSize"></label><output data-for="textSize"></output><input type="range" id="textSize" min="2" max="6" step="0.1" value="4"></div>
        <div class="row"><label for="spacing" data-i18n="range.spacing"></label><output data-for="spacing"></output><input type="range" id="spacing" min="0.8" max="2" step="0.05" value="1.1"></div>
        <div class="row"><label for="maxArc" data-i18n="range.maxArc"></label><output data-for="maxArc"></output><input type="range" id="maxArc" min="90" max="240" step="5" value="180"></div>
        <p class="metal-label" id="frontColourLabel"></p>
        <div class="metal" data-colour="front" data-i18n-attr="aria-label:front.colour"></div>
        <div class="relief-slot" data-relief-part="text"></div>
      </section>
      <section class="ws-panel" data-panel="icon" role="tabpanel" hidden>
        <div class="row"><label for="iconScale" data-i18n="range.iconScale"></label><output data-for="iconScale"></output><input type="range" id="iconScale" min="0.6" max="1.2" step="0.05" value="1"></div>
        <p class="hint" id="iconColourHint"></p>
        <div class="relief-slot" data-relief-part="icon"></div>
      </section>
      <section class="ws-panel" data-panel="frame" role="tabpanel" hidden>
        <div class="choices" data-choice="frame"></div>
        <div class="row"><label for="frameWidth" data-i18n="range.frameWidth"></label><output data-for="frameWidth"></output><input type="range" id="frameWidth" min="0.4" max="2" step="0.1" value="0.8"></div>
        <div class="metal" data-colour="frame" data-i18n-attr="aria-label:frame.aria"></div>
        <div class="relief-slot" data-relief-part="frame"></div>
      </section>
      <!-- the back when it isn't a face of its own: a design and its colour, or the front again in a colour of its own -->
      <section class="ws-panel" data-panel="back" role="tabpanel" hidden>
        <div class="back-design" id="backDesign">
          <div class="choices" data-choice="back"></div>
          <input type="file" id="upload" accept=".svg,image/svg+xml" hidden data-i18n-attr="aria-label:upload.aria">
          <p class="hint" id="uploadHint" hidden></p>
          <p class="metal-label" data-i18n="back.colour"></p>
          <div class="metal" data-colour="back" data-i18n-attr="aria-label:back.aria"></div>
        </div>
        <div class="back-match" id="backMatch">
          <p class="metal-label" id="matchColourLabel"></p>
          <div class="metal" data-colour="front" data-side="back" data-i18n-attr="aria-label:back.aria"></div>
          <p class="hint" data-i18n="back.matchHelp"></p>
          <div class="relief-slot" data-relief-part="all"></div>
        </div>
      </section>
      <section class="ws-panel" data-panel="body" role="tabpanel" hidden>
        <div class="row" id="diameterRow"><label for="diameter" data-i18n="range.diameter"></label><output data-for="diameter"></output><input type="range" id="diameter" min="30" max="60" step="1" value="45"></div>
        <div id="ringBaseRow" hidden>
          <p class="metal-label" data-i18n="ring.base"></p>
          <div class="choices" data-choice="ringBase" data-i18n-attr="aria-label:ring.base"></div>
          <p class="hint" id="ringBaseHint"></p>
        </div>
        <p class="hint" id="cardSizeHint" data-i18n="card.size" hidden></p>
        <div class="row"><label for="height" data-i18n="range.height"></label><output data-for="height"></output><input type="range" id="height" min="1.2" max="4" step="0.2" value="2"></div>
        <div class="row"><label for="depth" data-i18n="range.depth"></label><output data-for="depth"></output><input type="range" id="depth" min="0.2" max="1.6" step="0.2" value="0.2"></div>
        <p class="hint" id="depthHint"></p>
        <p class="metal-label" id="baseColourLabel" data-i18n="coin.colour"></p>
        <div class="metal" data-colour="base" data-i18n-attr="aria-label:coin.colour"></div>
      </section>
      <section class="ws-panel" data-panel="magnet" role="tabpanel" hidden>
        <div class="choices" data-choice="magnet"></div>
        <div class="choices" data-choice="magnetSize" id="magnetSizeRow"></div>
        <p class="hint" id="magnetHint"></p>
      </section>
      <!-- the raised parts' height: moved into the open tab's relief slot when something there is raised -->
      <div class="relief-height" id="reliefHeightBox" hidden>
        <div class="row" id="reliefHeightRow"><label for="reliefHeight" data-i18n="range.reliefHeight"></label><output data-for="reliefHeight"></output><input type="range" id="reliefHeight" min="0.4" max="1.2" step="0.2" value="0.6"></div>
      </div>
    </div>
  </aside>

  <!-- step 2: the token in 3D over your picked tokens; tap one to see it -->
  <section class="design-stage" id="designStage">
    <div class="view-panel">
      <div class="stage">
        <canvas id="view" data-i18n-attr="aria-label:view.aria"></canvas>
        <div class="turn" role="group" data-i18n-attr="aria-label:view.group">
          <button class="pill" type="button" data-view="angle" aria-pressed="true" data-i18n="view.angle"></button>
          <button class="pill" type="button" data-view="top" aria-pressed="false" data-i18n="view.front"></button>
          <button class="pill" type="button" data-view="back" aria-pressed="false" data-i18n="view.back"></button>
          <button class="pill" type="button" id="xray" aria-pressed="false" hidden data-i18n="view.xray" data-i18n-attr="title:view.xrayHelp"></button>
        </div>
      </div>
      <div class="caption">
        <h2 id="name">&nbsp;</h2>
        <p id="sub"></p>
      </div>
      <div class="ws-actions">
        <button class="pill" id="download" type="button" data-i18n="act.stl"></button>
        <p class="hint note" id="exportNote"></p>
      </div>
    </div>
    <div class="ds-grid" id="designGrid"></div>
  </section>

  <!-- step 3: how to print -->
  <section class="print-page" id="printPage">
    <div class="pp-in">
      <h2 data-i18n="print.title"></h2>
      <p class="hint" id="printLead"></p>

<div class="gate" id="gate">
  <details class="lang-menu gate-langs" data-lang-menu hidden></details>
  <div class="gate-card">
    <img class="gate-logo" src="/logo-mark.svg" alt="" width="88" height="88">
    <p class="mark wordmark"><span class="wm-mid">Midnight</span><span class="wm-mint">Mint</span></p>
    <p class="brand-title gate-title-brand" hidden></p>
    <p class="faber-wm gate-faber own-only">TESSERAE<span class="ip" aria-hidden="true"></span>FABER</p>
    <h2 id="gateTitle">Abriendo el grimorio…</h2>
    <p id="gateText"></p>
    <button class="forge" type="button" id="gateAction" hidden></button>
    <button class="pill" type="button" id="gateSecondary" hidden></button>
    <footer class="ccc">
      <p id="gateCcc" data-i18n="ccc.gate">Herramienta gratuita hecha por la comunidad para imprimir tus propios tokens de personaje. No está afiliada ni respaldada por The Pandemonium Institute.</p>
    </footer>
  </div>
</div>
<script>
  // The loading screen before the app's code has loaded. The markup above is Clocktower's (/botc);
  // anywhere else it's Tesserae Faber's, plain, or as the collection wore it last time (main.ts
  // keepGateLook). Then the saved language.
  try {
    var en = localStorage.getItem("midnight-mint-lang") === "en", root = document.documentElement;
    if (en) root.lang = "en";
    if (/^\/botc(\/|$)/.test(location.pathname)) {
      if (en) {
        document.getElementById("gateTitle").textContent = "Opening the grimoire…";
        document.getElementById("gateCcc").textContent = "A free, community-made tool for printing your own character tokens. Not affiliated with or endorsed by The Pandemonium Institute.";
      }
    } else {
      root.dataset.mode = "own";
      var card = document.querySelector(".gate-card"), look = null;
      try { look = JSON.parse(localStorage.getItem("midnight-mint-gate:" + location.pathname)); } catch (e) { /* none kept */ }
      card.querySelector(".wordmark").hidden = true;
      card.querySelector(".gate-logo").src = (look && look.logo) || "/tesserae-faber.svg";
      document.getElementById("gateTitle").textContent = (look && look.title) || (en ? "Opening…" : "Abriendo…");
      var ccc = card.querySelector(".ccc");
      if (look && look.footer) document.getElementById("gateCcc").textContent = look.footer; else ccc.hidden = true;
      if (look) {
        root.dataset.theme = look.theme || "";
        for (var k in look.vars) root.style.setProperty(k, look.vars[k]);
        var bt = card.querySelector(".brand-title"); bt.textContent = look.name || ""; bt.hidden = !look.name;
      }
    }
  } catch (e) { /* no storage */ }
</script>
