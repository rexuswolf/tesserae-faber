<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Mint</title>
<meta name="description" content="Design 3D-printable tokens for your Blood on the Clocktower group. A free tool made by the community.">
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
<!-- Wordmark "Grimorio": the blackletter face is only used for "Midnight", so load just those letters. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=Midnight&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app" id="app" hidden>

  <!-- top bar: the three steps (pick, design, print) and the token language -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" type="button" id="drawerOpen" aria-controls="spine" aria-expanded="false" data-i18n-attr="aria-label:top.menu">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <div class="brand"><img src="/logo-mark.svg" alt="" width="36" height="36"><span class="wordmark"><span class="wm-mid">Midnight</span><span class="wm-mint">Mint</span></span></div>
    <nav class="flow-steps" id="flowSteps" data-i18n-attr="aria-label:flow.aria"></nav>
    <button class="tlang-trigger" id="tokenLangBtn" type="button" aria-haspopup="dialog"></button>
  </header>

  <!-- the sidebar: editions (more groups, like scripts, can join them), then language, account and credits.
       On a phone it is a drawer. -->
  <nav class="spine" id="spine" data-i18n-attr="aria-label:spine.aria">
    <div class="spine-scroll">
      <!-- every character, and the grimoire's info tokens: above the editions -->
      <div id="library"></div>
      <hr class="spine-rule">
      <h2 class="spine-h" data-i18n="spine.editions"></h2>
      <div id="editions"></div>
      <div class="spine-h spine-sec"><h2 data-i18n="spine.scripts"></h2>
        <button class="spine-add" type="button" id="scriptNew" data-i18n-attr="aria-label:script.new title:script.new">+</button></div>
      <div id="scripts"></div>
    </div>
    <footer class="spine-foot">
    <!-- the guide and the language; the community-content banner; about the tool and its credits -->
    <div class="foot-row">
      <button class="guide-btn" type="button" data-guide aria-haspopup="dialog"><span class="q" aria-hidden="true">?</span><span data-i18n="guide.open"></span></button>
      <span class="acc-tools">
      <button class="lang-btn" type="button" id="uiLangBtn" aria-haspopup="dialog"></button>
      <button type="button" class="admin-sign-in" id="adminSignIn" hidden data-i18n="gate.signIn"></button>
      <details class="me" hidden>
        <summary data-i18n-attr="aria-label:me.aria"><img id="avatar" alt="" referrerpolicy="no-referrer"></summary>
        <div class="menu">
          <p id="meEmail"></p>
          <button type="button" id="openAdmin" hidden data-i18n="me.admin"></button>
          <button type="button" id="signOut" data-i18n="me.signOut"></button>
        </div>
      </details>
      </span>
    </div>
    <a href="#" class="ccc-banner" data-about data-i18n-attr="title:about.link"><img src="/ccc-sleeve.png" alt="Community Created Content" width="344" height="136"></a>
    <a href="#" class="about-link" data-about data-i18n="about.link"></a>
    </footer>
  </nav>
  <div class="scrim" id="scrim"></div>

  <!-- script sheet -->
  <main class="sheet" id="sheet">
    <header class="sheet-head">
      <!-- what's shown, and the one way to add it to the queue -->
      <div class="head-row">
        <div class="head-text">
          <div class="sheet-title">
            <h1 id="edTitle"></h1>
          </div>
          <p id="edLead" class="lead"></p>
        </div>
        <div class="addmenu" id="addWrap">
          <button class="pill add main" type="button" id="addBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="addMenu"><svg class="gi plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span id="addLabel"></span><svg class="gi chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="menu" id="addMenu" role="menu" aria-labelledby="addBtn" hidden></div>
        </div>
      </div>
      <div class="script-actions" id="scriptActions" hidden>
        <button class="pill" type="button" id="scriptShare"></button>
        <button class="pill" type="button" id="scriptJson" data-i18n="script.json"></button>
        <button class="pill danger" type="button" id="scriptDelete" data-i18n="script.delete"></button>
        <p class="hint" id="scriptNote" aria-live="polite"></p>
        <p class="hint warn" id="scriptCustomWarn" data-i18n="script.customWarn" hidden></p>
      </div>
      <!-- what only narrows the list -->
      <div class="filters">
        <span class="eyebrow"><svg class="gi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span data-i18n="filter.label"></span></span>
        <div class="filter-row">
          <label class="search-box"><svg class="gi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input type="search" id="search" class="search" autocomplete="off" data-i18n-attr="placeholder:sheet.search aria-label:sheet.search"></label>
          <div class="chips" id="teamChips" role="group" data-i18n-attr="aria-label:tray.team"></div>
        </div>
      </div>
    </header>
    <div id="rows"></div>
  </main>

  <!-- workshop -->
  <aside class="workshop" id="workshop">
    <div class="ws-head">
      <div class="scope" role="group" data-i18n-attr="aria-label:ws.scopeGroup">
        <button type="button" data-tab="set" aria-pressed="true" data-i18n="ws.set"></button>
        <button type="button" data-tab="token" aria-pressed="false" data-i18n="ws.token"></button>
      </div>
      <p class="scope-note"><span id="styleScope"></span> <button class="link" type="button" id="resetToken" data-i18n="ws.reset" hidden></button></p>
    </div>
    <!-- the template isn't one more section: it replaces the whole design, and each section adjusts one part of it.
         Open, the templates sit right under this line and the sections wait until it closes. -->
    <button class="tpl-row" type="button" id="tplRow" aria-expanded="true" aria-controls="presetsPanel"></button>
    <div class="sections" id="sections" role="tablist" data-i18n-attr="aria-label:ws.sections" hidden>
      <button type="button" role="tab" data-section="text" aria-selected="false" data-i18n="sec.text"></button>
      <button type="button" role="tab" data-section="frame" aria-selected="false" data-i18n="sec.frame"></button>
      <button type="button" role="tab" data-section="back" aria-selected="false" data-i18n="sec.back"></button>
      <button type="button" role="tab" data-section="coin" aria-selected="false" data-i18n="sec.coin"></button>
      <button type="button" role="tab" data-section="magnet" aria-selected="false" data-i18n="sec.magnet"></button>
    </div>
    <div class="ws-body" id="styleFields">
      <div class="ws-warn" id="colourWarn" hidden></div>
      <section class="ws-panel" id="presetsPanel" data-panel="presets">
        <div class="presets" id="presetsBox">
          <div class="preset-list" id="presets"></div>
          <p class="hint" id="presetHelp"></p>
        </div>
        <div class="saved-zone" id="savedPanel">
          <h3 class="zone-title"><span data-i18n="ws.saved"></span> <small id="savedSummary"></small></h3>
          <button class="pill" type="button" id="save" data-i18n="act.save"></button>
          <p class="hint" id="saveNote" data-i18n="saved.help"></p>
          <ul class="list" id="saved"></ul>
        </div>
      </section>
      <section class="ws-panel" data-panel="text" role="tabpanel" hidden>
        <div class="token-only" id="tokenOnly">
          <label class="field"><span data-i18n="ws.printedText"></span><input class="text" type="text" id="printed" autocomplete="off"></label>
          <label class="check" id="femRow" hidden><input type="checkbox" id="fem"> <span id="femLabel"></span></label>
          <div class="field icon-field" id="iconField">
            <span data-i18n="icon.label"></span>
            <div class="icon-actions">
              <button class="pill" type="button" id="iconSearchOpen" data-i18n="icon.search"></button>
              <button class="pill" type="button" id="iconUpload" data-i18n="icon.upload"></button>
              <button class="link" type="button" id="iconReset" data-i18n="icon.reset" hidden></button>
            </div>
            <input type="file" id="iconFile" accept=".svg,image/svg+xml" hidden>
            <p class="hint" id="iconHint"></p>
            <div class="icon-search" id="iconSearch" hidden>
              <input class="text" type="search" id="iconQuery" autocomplete="off" data-i18n-attr="placeholder:icon.placeholder">
              <div class="icon-results" id="iconResults"></div>
            </div>
          </div>
        </div>
        <p class="hint" id="textOnlyHint" data-i18n="ws.textInToken"></p>
        <div class="choices" data-choice="style"></div>
        <div class="choices" data-choice="windowFinish" id="windowFinishRow"></div>
        <p class="hint" id="styleHint"></p>
        <div class="row" id="windowDepthRow"><label for="windowDepth" data-i18n="range.windowDepth"></label><output data-for="windowDepth"></output><input type="range" id="windowDepth" min="0.4" max="1.6" step="0.2" value="0.8"></div>
        <p class="hint" id="nameHint"></p>
        <div class="row"><label for="textSize" data-i18n="range.textSize"></label><output data-for="textSize"></output><input type="range" id="textSize" min="2" max="6" step="0.1" value="4"></div>
        <div class="row"><label for="spacing" data-i18n="range.spacing"></label><output data-for="spacing"></output><input type="range" id="spacing" min="0.8" max="2" step="0.05" value="1.1"></div>
        <div class="row"><label for="maxArc" data-i18n="range.maxArc"></label><output data-for="maxArc"></output><input type="range" id="maxArc" min="90" max="240" step="5" value="180"></div>
        <div class="row"><label for="iconScale" data-i18n="range.iconScale"></label><output data-for="iconScale"></output><input type="range" id="iconScale" min="0.6" max="1.2" step="0.05" value="1"></div>
        <p class="metal-label" id="frontColourLabel"></p>
        <div class="metal" data-colour="front" data-i18n-attr="aria-label:front.colour"></div>
      </section>
      <section class="ws-panel" data-panel="frame" role="tabpanel" hidden>
        <div class="choices" data-choice="frame"></div>
        <div class="row"><label for="frameWidth" data-i18n="range.frameWidth"></label><output data-for="frameWidth"></output><input type="range" id="frameWidth" min="0.4" max="2" step="0.1" value="0.8"></div>
        <div class="metal" data-colour="frame" data-i18n-attr="aria-label:frame.aria"></div>
      </section>
      <section class="ws-panel" data-panel="back" role="tabpanel" hidden>
        <div class="choices" data-choice="back"></div>
        <input type="file" id="upload" accept=".svg,image/svg+xml" hidden data-i18n-attr="aria-label:upload.aria">
        <p class="hint" id="uploadHint" hidden></p>
        <div class="metal" data-colour="back" data-i18n-attr="aria-label:back.aria"></div>
      </section>
      <section class="ws-panel" data-panel="coin" role="tabpanel" hidden>
        <p class="metal-label" data-i18n="coin.colour"></p>
        <div class="metal" data-colour="base" data-i18n-attr="aria-label:coin.colour"></div>
        <div class="row"><label for="diameter" data-i18n="range.diameter"></label><output data-for="diameter"></output><input type="range" id="diameter" min="30" max="60" step="1" value="45"></div>
        <div class="row"><label for="height" data-i18n="range.height"></label><output data-for="height"></output><input type="range" id="height" min="1.2" max="4" step="0.2" value="2"></div>
        <div class="row"><label for="depth" data-i18n="range.depth"></label><output data-for="depth"></output><input type="range" id="depth" min="0.2" max="1.6" step="0.2" value="0.2"></div>
        <p class="hint" id="depthHint"></p>
      </section>
      <section class="ws-panel" data-panel="magnet" role="tabpanel" hidden>
        <div class="choices" data-choice="magnet"></div>
        <div class="choices" data-choice="magnetSize" id="magnetSizeRow"></div>
        <p class="hint" id="magnetHint"></p>
      </section>
    </div>
  </aside>

  <!-- step 2: the token in 3D over your picked tokens; tap one to see it -->
  <section class="design-stage" id="designStage">
    <div class="view-panel">
      <div class="stage">
        <canvas id="view" data-i18n-attr="aria-label:view.aria"></canvas>
        <div class="turn" role="group" data-i18n-attr="aria-label:view.group">
          <button class="pill" type="button" data-view="angle" aria-pressed="true" data-i18n="view.angle"></button>
          <button class="pill" type="button" data-view="top" aria-pressed="false" data-i18n="view.front"></button>
          <button class="pill" type="button" data-view="back" aria-pressed="false" data-i18n="view.back"></button>
          <button class="pill" type="button" id="xray" aria-pressed="false" hidden data-i18n="view.xray" data-i18n-attr="title:view.xrayHelp"></button>
        </div>
      </div>
      <div class="caption">
        <h2 id="name">&nbsp;</h2>
        <p id="sub"></p>
      </div>
      <div class="ws-actions">
        <button class="pill" id="download" type="button" data-i18n="act.stl"></button>
        <p class="hint note" id="exportNote"></p>
      </div>
    </div>
    <div class="ds-grid" id="designGrid"></div>
  </section>

  <!-- step 3: how to print -->
  <section class="print-page" id="printPage">
    <div class="pp-in">
      <h2 data-i18n="print.title"></h2>
      <p class="hint" id="printLead"></p>
      <div class="ways" role="radiogroup" data-i18n-attr="aria-label:queue.howAria">
        <button class="way" type="button" role="radio" data-way="3d"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v4H4zM6 7v8h12V7M9 15v3h6v-3M3 21h18M12 10v2"/></svg><b data-i18n="queue.way3d"></b><small id="way3dSub"></small></button>
        <button class="way" type="button" role="radio" data-way="paper"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/><circle cx="10" cy="11" r="2"/><circle cx="15" cy="11" r="2"/><circle cx="10" cy="16" r="2"/><circle cx="15" cy="16" r="2"/></svg><b data-i18n="queue.wayPaper"></b><small id="wayPaperSub"></small></button>
      </div>
      <div id="printDetail"></div>
      <p class="hint" id="printNote" aria-live="polite"></p>
    </div>
  </section>

  <!-- the selection and the way on -->
  <footer class="queuebar" id="queuebar">
    <button class="qb-toggle" type="button" id="queueToggle" aria-haspopup="dialog">
      <span class="stack" id="queueStack"></span>
      <span id="queueCount"></span>
    </button>
    <p class="hint" id="queueSummary"></p>
    <button class="flow-back" type="button" id="flowBack"></button>
    <button class="forge" type="button" id="flowNext"></button>
  </footer>
  <!-- your selection: characters with their copies and reminders -->
  <dialog class="qdrawer" id="queueDrawer" aria-labelledby="queueTitle">
    <div class="qd-head">
      <h2 id="queueTitle"></h2>
      <button class="pill" type="button" id="queueClear" data-i18n="queue.clear"></button>
      <button class="icon-btn" type="button" id="queueClose" data-i18n-attr="aria-label:admin.close">×</button>
    </div>
    <div class="qd-body" id="queueBody"><div id="queue"></div></div>
    <div class="toast" id="queueToast" hidden><span></span><button type="button" data-i18n="queue.undo"></button></div>
  </dialog>
  <!-- "Removed · Undo" on the page itself (step 2), when the drawer isn't open -->
  <div class="toast app-toast" id="appToast" role="status" hidden><span></span><button type="button" data-i18n="queue.undo"></button></div>
</div>

<div class="gate" id="gate">
  <details class="lang-menu gate-langs" data-lang-menu hidden></details>
  <div class="gate-card">
    <img class="gate-logo" src="/logo-mark.svg" alt="" width="88" height="88">
    <p class="mark wordmark"><span class="wm-mid">Midnight</span><span class="wm-mint">Mint</span></p>
    <h2 id="gateTitle">Abriendo el grimorio…</h2>
    <p id="gateText"></p>
    <button class="forge" type="button" id="gateAction" hidden></button>
    <button class="pill" type="button" id="gateSecondary" hidden></button>
    <footer class="ccc">
      <img src="/ccc-sleeve.png" alt="Community Created Content" width="86" height="34">
      <p id="gateCcc" data-i18n="ccc.gate">Herramienta gratuita hecha por la comunidad para imprimir tus propios tokens de personaje. No está afiliada ni respaldada por The Pandemonium Institute.</p>
    </footer>
  </div>
</div>
<script>
  // Shown before the app code has loaded: switch the loading screen to English if that's the saved language.
  try {
    if (localStorage.getItem("midnight-mint-lang") === "en") {
      document.documentElement.lang = "en";
      document.getElementById("gateTitle").textContent = "Opening the grimoire…";
      document.getElementById("gateCcc").textContent = "A free, community-made tool for printing your own character tokens. Not affiliated with or endorsed by The Pandemonium Institute.";
    }
  } catch (e) { /* no storage */ }
</script>

<!-- how it works: the three steps, one at a time, with a picture of each -->
<dialog id="guide" aria-labelledby="guideTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <p class="guide-kicker" id="guideKicker"></p>
  <h2 id="guideTitle"></h2>
  <img id="guideShot" alt="" width="960" height="600" decoding="async">
  <p class="guide-text" id="guideText"></p>
  <div class="guide-nav">
    <button class="pill" type="button" id="guideBack" data-i18n="guide.back"></button>
    <span class="guide-dots" id="guideDots" aria-hidden="true"></span>
    <button class="forge" type="button" id="guideNext"></button>
  </div>
</dialog>

<!-- the interface language, from the flag in the sidebar -->
<dialog id="uiLang" class="ui-lang" aria-labelledby="uiLangTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="uiLangTitle" data-i18n="lang.title"></h2>
  <p class="hint" data-i18n="lang.hint"></p>
  <ul class="ui-lang-list" id="uiLangList"></ul>
</dialog>

<dialog id="credits" aria-labelledby="creditsTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="creditsTitle" data-i18n="about.title"></h2>
  <div class="credits" id="creditsBody"></div>
</dialog>

<dialog id="tlangDialog" class="tlang-dialog" aria-labelledby="tlangTitle">
  <div class="tl-head">
    <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
    <h2 id="tlangTitle" data-i18n="tlang.title"></h2>
    <p class="hint" data-i18n="tlang.intro"></p>
  </div>
  <div class="tl-split">
    <div class="tl-list" id="tlangList" role="listbox" data-i18n-attr="aria-label:tlang.title"></div>
    <div class="tl-stage" id="tlangStage" aria-live="polite"></div>
  </div>
  <div class="tl-foot">
    <button class="pill" type="button" id="tlangCancel" data-i18n="tlang.cancel"></button>
    <button class="forge" type="button" id="tlangUse"></button>
  </div>
</dialog>

<dialog id="scriptDialog" class="script-dialog" aria-labelledby="scriptDialogTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="scriptDialogTitle" data-i18n="script.dialogTitle"></h2>
  <p class="hint" data-i18n="script.dialogIntro"></p>
  <label class="pill file"><span data-i18n="script.file"></span><input type="file" id="scriptDialogFile" accept="application/json,.json" hidden></label>
  <label class="field"><span data-i18n="script.paste"></span><textarea class="text" id="scriptDialogText" rows="5" spellcheck="false" placeholder='[{"id":"_meta","name":"…"},"washerwoman","librarian",…]'></textarea></label>
  <p class="hint warn" id="scriptDialogWarn" data-i18n="script.customWarn" aria-live="polite" hidden></p>
  <p class="hint" id="scriptDialogNote" aria-live="polite"></p>
  <div class="dialog-actions"><button class="pill" type="button" id="scriptDialogCancel" data-i18n="script.cancel"></button><button class="forge" type="button" id="scriptDialogSave" data-i18n="script.add"></button></div>
</dialog>

<dialog id="scriptInvite" class="script-dialog" aria-labelledby="scriptInviteTitle">
  <h2 id="scriptInviteTitle" data-i18n="script.inviteTitle"></h2>
  <p id="scriptInviteText"></p>
  <div class="invite-tokens" id="scriptInviteTokens"></div>
  <div class="dialog-actions"><button class="pill" type="button" id="scriptInviteSkip" data-i18n="script.inviteSkip"></button><button class="forge" type="button" id="scriptInviteSave" autofocus data-i18n="script.inviteSave"></button></div>
</dialog>

<dialog id="admin" aria-labelledby="adminTitle">
  <form method="dialog" class="close"><button class="pill" data-i18n="admin.close"></button></form>
  <h2 id="adminTitle" data-i18n="admin.title"></h2>
  <section>
    <h3 data-i18n="admin.library"></h3>
    <p class="hint" id="libraryState"></p>
    <div class="import">
      <label class="pill file"><span data-i18n="admin.uploadRoles"></span><input type="file" id="libraryFile" accept="application/json,.json" hidden></label>
    </div>
  </section>
</dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
