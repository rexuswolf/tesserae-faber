<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear Art</title>
<style>body { background: #1c1a18; color: #ece3d0; font: 15px system-ui; padding: 20px; } .out { display: flex; gap: 20px; align-items: start; flex-wrap: wrap; } .out > div { width: 460px; }</style>
</head>
<body>
<!-- Draws the generic creator's front-page art with the app's engine, as standalone SVG files, in
     Spanish and in English (the page shows the one in the interface's language): public/crear-hero.svg
     (a honeycomb of tokens with the Tesserae Faber mark in the middle) and each collection's cover
     strip, public/collections/<id>-preview.svg; the English ones end in -en. Open it on the UI test
     server (port 5198) to see them, or run tools/make-crear-art.mjs, which saves them into public/.
     Names are outlines, so the files need no font. -->
<p>Arte de la portada de Crear y las tiras de las colecciones, en español y en inglés.</p>
<div class="out" id="out"></div>
<script type="module">
import { loadLibrary, tokenSvg, buildToken, DEFAULT_SPEC, FILAMENTS, THREE } from "/src/engine/token-engine.ts";
import { firestoreRoles } from "/tools/ui-test/mock-roles.js";
import { gameIcon } from "/src/icons.ts";

const lib = await loadLibrary(await firestoreRoles.list());
const role = (en) => lib.roles.find((r) => r.en === en);
const logo = await (await fetch("/tesserae-faber.svg")).text();
/** A token's SVG placed as a cell of a bigger one (its own viewBox kept). */
const place = (svg, x, y, s, cls, i) => `<g class="${cls}" style="--i:${i}" filter="url(#lift)">${svg.replace(/<title>[\s\S]*?<\/title>/, "").replace(/<svg[^>]*?viewBox="([^"]+)"[^>]*>/, (_, vb) => `<svg x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s}" height="${s}" viewBox="${vb}">`)}</g>`;
const defs = `<defs><filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter></defs>`;
// a component in 3D, lit like the app's preview, as a WebP: seen at "tilt" from the side "from", turned "turn" on the
// table, tipped "lift" degrees about the level axis at "liftDir" (its face towards you); transparent round it
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(400, 400); renderer.setPixelRatio(1);
function shot(t, tilt, turn, from = 0, lift = 0, liftDir = 0) {
  const scene = new THREE.Scene(), deg = THREE.MathUtils.degToRad;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3440, 1.57));
  const key = new THREE.DirectionalLight(0xffffff, 2.9); key.position.set(-70, -90, 150); scene.add(key);
  const g = new THREE.Group();
  for (const [name, geom] of Object.entries(t.parts)) { if (!geom || ["magnet", "hole", "magnetBody", "cavity"].includes(name)) continue; const m = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: t.colours[name] ?? t.colours.base, roughness: 0.6, metalness: 0.05 })); if (name !== "base") m.position.z = 0.02; g.add(m); }
  const box = new THREE.Box3().setFromObject(g), size = box.getSize(new THREE.Vector3()); g.position.sub(box.getCenter(new THREE.Vector3()));
  g.rotation.z = deg(turn);
  const hold = new THREE.Group(); hold.add(g);
  if (lift) hold.quaternion.setFromAxisAngle(new THREE.Vector3(Math.cos(deg(liftDir)), Math.sin(deg(liftDir)), 0), deg(lift));
  scene.add(hold);
  const d = Math.max(size.x, size.y) * 0.62, cam = new THREE.OrthographicCamera(-d, d, d, -d, 0.1, 1000), a = deg(tilt), f = deg(from - 90);
  cam.up.set(0, 0, 1); cam.position.set(Math.cos(f) * Math.sin(a) * 200, Math.sin(f) * Math.sin(a) * 200, Math.cos(a) * 200); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL("image/webp", 0.86);
}
const icons = new Map(), iconOf = async (path) => { if (!icons.has(path)) icons.set(path, await gameIcon(path)); return icons.get(path); };

// Everything in one language: names are [es, en]
async function art(lang) {
  const n = (names) => names[lang === "es" ? 0 : 1];
  const base = { ...DEFAULT_SPEC, lang, frame: "rim", frameWidth: 0.8, back: "edition", depth: 0.4, colours: { ...DEFAULT_SPEC.colours, base: FILAMENTS.black, front: "team", frame: "team", back: FILAMENTS.gold } };
  // a range of designs, so the honeycomb shows what the app can do
  const D = {
    edicion: base,
    marfil: { ...base, frameWidth: 1, colours: { ...base.colours, base: FILAMENTS.white } },
    noche: { ...base, frame: "fases" },
    medianoche: { ...base, frame: "firmamento" },
    ventana: { ...base, style: "window", textSize: 6, frame: "none", colours: { ...base.colours, base: FILAMENTS.white } },
    doble: { ...base, style: "double" },
    solo: { ...base, style: "solo" },
  };
  const own = async (names, path, colour, spec = base) => {
    const name = n(names), icon = await iconOf(path);
    const r = { id: `own_${name}`, en: name, es: name, team: "townsfolk", edition: "own", editionName: "Tesserae Faber", d: [], body: "", g: "" };
    return tokenSvg(lib, r, { ...spec, icon, colours: { ...spec.colours, front: colour, frame: colour } }, { text: name });
  };
  const botc = (en, spec = base) => tokenSvg(lib, role(en), spec);
  // the other kinds of component: a piece, a base tray, a condition ring, a card
  const other = async (kind, names, path, colour, spec) => {
    const name = n(names), icon = path ? await iconOf(path) : undefined;
    const r = { id: `own_${kind}_${name}`, kind, en: name, es: name, team: "townsfolk", colour, edition: "own", editionName: "Tesserae Faber", d: [], body: "", g: "" };
    const svg = tokenSvg(lib, r, { ...DEFAULT_SPEC, lang, ...(icon ? { icon } : {}), ...spec }, { text: name });
    // a silhouette doesn't fill its square as a coin does its circle: drawn closer, as large as the others
    return spec.pieceShape === "silhouette" ? svg.replace(/viewBox="([^"]+)"/, (_, vb) => { const [x, y, w] = vb.split(" ").map(Number), k = 0.78; return `viewBox="${x * k} ${y * k} ${w * k} ${w * k}"`; }) : svg;
  };
  const white = FILAMENTS.white, black = FILAMENTS.black;
  const raised = { relief: { text: false, frame: false, icon: true } };

  // the front page's art: two or so of each kind of component, in 3D, mostly face-on, each at its own slant, a third
  // tipped up towards you; in rows of 4, 5 and 4, each nudged and turned a little (tools/hero-protos chose them)
  const K = black, coin = { frame: "rim", frameWidth: 0.8, back: "none", colours: { base: K, front: "team", frame: "team", back: FILAMENTS.gold } };
  const piece = (x) => ({ relief: { text: false, frame: false, icon: true }, diameter: 25, pieceMargin: 1, colours: { base: "team", front: white, frame: white, back: K }, ...x });
  const PICKS = [
    ["coin", ["Lobo", "Wolf"], "lorc/wolf-head", "#b3191e", { ...coin, frame: "fases" }],
    ["coin", ["Senador", "Senator"], "delapouite/greek-temple", "#ece9e2", { ...coin, frame: "laurel" }],
    ["coin", ["Protegido", "Protected"], "lorc/eye-shield", "#8a3d9e", { ...coin, frame: "greca2" }],
    ["coin", ["+1", "+1"], null, "#3f9651", { ...coin, style: "text", frame: "ficha" }],
    ["info", ["Elige a un jugador", "Choose a player"], "lorc/potion-ball", "#8a3d9e", { cardIcon: "left", frame: "rim", colours: { base: K, front: white, frame: "team", back: K } }],
    ["info", ["Ley de la República", "Law of the Republic"], "delapouite/greek-temple", "#ece9e2", { cardIcon: "left", frame: "laurel", colours: { base: K, front: white, frame: white, back: K } }],
    ["ring", ["Envenenado", "Poisoned"], null, "#3f9651", { ringBase: "25", frame: "rim", colours: { base: K, front: "team", frame: "team", back: K } }],
    ["ring", ["Aturdido", "Dazed"], null, "#d4a72c", { ringBase: "25", frame: "none", colours: { base: "team", front: K, frame: K, back: K } }],
    ["base", ["Orco 2", "Orc 2"], null, "#d4a72c", { ringBase: "32", frame: "none", height: 2.5, colours: { base: "team", front: K, frame: K, back: K } }],
    ["base", ["12", "12"], null, "#3f9651", { ringBase: "25", frame: "none", height: 2.5, colours: { base: "team", front: K, frame: K, back: K } }],
    ["piece", ["Meeple", "Meeple"], "delapouite/meeple", "#2f86e0", piece({ pieceShape: "silhouette", pieceIcon: false, pieceMargin: 0.6 })],
    ["piece", ["Corona", "Crown"], "lorc/crown", "#d4a72c", piece({ pieceShape: "silhouette" })],
    ["piece", ["Espadas", "Swords"], "lorc/crossed-swords", "#a7adb4", piece({ pieceShape: "silhouette", colours: { base: K, front: "team", frame: "team", back: K } })],
  ];
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const order = [...PICKS].sort(() => rnd() - 0.5), Wd = 1000, cell = 195, rowsOf = [4, 5, 4], Hd = 3 * 235 + 30;
  let cells = "", i = 0;
  for (const [r, k] of rowsOf.entries()) for (let c = 0; c < k; c++, i++) {
    const [kind, names, path, colour, spec] = order[i], name = n(names), icon = path ? await iconOf(path) : undefined;
    const role = { id: `hero_${kind}_${name}`, ...(kind === "coin" ? {} : { kind }), en: name, es: name, team: "townsfolk", colour, edition: "own", editionName: "Tesserae Faber", d: [], body: "", g: "" };
    const t = buildToken(lib, role, { ...DEFAULT_SPEC, lang, ...(icon ? { icon } : {}), ...spec }, name);
    const cx = Wd / 2 + (c - (k - 1) / 2) * 188 + (rnd() - 0.5) * 20, cy = 15 + cell / 2 + r * 235 + (rnd() - 0.5) * 20, rot = (rnd() - 0.5) * 12;
    let s = cell * (kind === "info" ? 1.12 : kind === "piece" ? 0.9 : 1) * (0.95 + rnd() * 0.1);
    const from = (rnd() - 0.5) * 100, up = rnd() < 0.38;
    const png = up ? shot(t, 26 + rnd() * 10, rot * 1.5, from, 16 + rnd() * 10, from + (rnd() - 0.5) * 30) : shot(t, 8 + rnd() * 18, rot * 1.5, from);
    if (up) s *= 1.12;
    cells += `<g class="cell" style="--i:${i}"><image filter="url(#${up ? "float" : "lift"})" href="${png}" x="${(cx - s * 0.58).toFixed(1)}" y="${(cy - s * 0.58).toFixed(1)}" width="${(s * 1.16).toFixed(1)}" height="${(s * 1.16).toFixed(1)}"/></g>`;
  }
  const heroDefs = defs.replace("</defs>", `<filter id="float" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter></defs>`);
  const hero = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${n(["Componentes hechos con Tesserae Faber", "Components made with Tesserae Faber"])}">${heroDefs}${cells}</svg>`;

  // a cover strip: five tokens, overlapping
  const s = 120, step = 96;
  const strip = (svgs, label) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s + step * (svgs.length - 1) + 20} ${s + 24}" role="img" aria-label="${n(label)}">${defs}${svgs.map((svg, j) => place(svg, 10 + j * step, 6, s, "cell", j)).join("")}</svg>`;
  const ownStrip = async (list, label, spec = base) => { const svgs = []; for (const [names, path, colour] of list) svgs.push(await own(names, path, colour, spec)); return strip(svgs, label); };

  return {
    hero,
    // Clocktower's: its characters, in the language (the library has their names)
    botc: strip(["Fortune Teller", "Imp", "Empath", "Poisoner", "Undertaker"].map((en) => botc(en)), ["Fichas de Blood on the Clocktower", "Blood on the Clocktower tokens"]),
    // Draw Steel's: some of its resources and a condition, in their groups' colours
    drawsteel: await ownStrip([[["Impulso", "Surge"], "lorc/power-lightning", "#d4a72c"], [["Ira", "Wrath"], "delapouite/enrage", "#b3191e"], [["Malicia", "Malice"], "lorc/imp-laugh", "#8a3d9e"], [["Victoria", "Victory"], "lorc/laurel-crown", "#d4a72c"], [["Sangrando", "Bleeding"], "lorc/bleeding-wound", "#a7adb4"]], ["Fichas de Draw Steel", "Draw Steel tokens"]),
    // 5e Fantasy's: a two-sided marker, three conditions and Bloodied, in their colours
    srd5e: await ownStrip([[["Ventaja", "Advantage"], "delapouite/dice-twenty-faces-twenty", "#d4a72c"], [["Asustado", "Frightened"], "lorc/terror", "#8a3d9e"], [["Ensangrentado", "Bloodied"], "lorc/bleeding-heart", "#b3191e"], [["Envenenado", "Poisoned"], "lorc/poison-bottle", "#3f9651"], [["Paralizado", "Paralyzed"], "delapouite/frozen-body", "#2f86e0"]], ["Fichas de Fantasía 5e", "5e Fantasy tokens"]),
    // Secret Caesar's (the Senate's): the three sides, the vote and the Consul, in their colours, in its laurel wreath
    senado: await ownStrip([[["Republicano", "Republican"], "delapouite/greek-temple", "#ece9e2"], [["Conspirador", "Conspirator"], "lorc/cloak-dagger", "#b3191e"], [["Aspirante a César", "Aspiring Caesar"], "delapouite/caesar", "#8a3d9e"], [["Placet", "Placet"], "delapouite/thumb-up", "#2f86e0"], [["Cónsul", "Consul"], "lorc/laurel-crown", "#a7adb4"]], ["Fichas de Secret Caesar", "Secret Caesar tokens"], { ...base, frame: "laurel" }),
    // TCG Counters': painted coins as its designs draw them (the coin in its colour, white on it; black on a light one):
    // a Pokémon damage counter, Poisoned, a Star Wars: Unlimited Shield, a Magic +1/+1, a Lorcana lore counter
    tcg: strip(await Promise.all([[["10", "10"], null, "#d4a72c", "text"], [["Envenenado", "Poisoned"], "lorc/poison-bottle", "#8a3d9e"], [["Escudo", "Shield"], "lorc/energy-shield", "#2f86e0"], [["+1/+1", "+1/+1"], null, "#3f9651", "text"], [["5", "5"], null, "#8a3d9e", "text", "#c9a227"]]
      .map(async ([names, path, colour, style, ink]) => {
        const name = n(names), icon = path ? await iconOf(path) : undefined, fg = ink ?? (["#d4a72c", "#c9a227"].includes(colour) ? FILAMENTS.black : FILAMENTS.white);
        const r = { id: `tcg_${name}`, en: name, es: name, team: "townsfolk", edition: "own", editionName: "Tesserae Faber", d: [], body: "", g: "" };
        return tokenSvg(lib, r, { ...base, back: "none", frameWidth: 0.9, ...(style ? { style, textSize: 14 } : {}), ...(icon ? { icon } : {}), colours: { ...base.colours, base: colour, front: fg, frame: fg } }, { text: name });
      })), ["Fichas de Contadores TCG", "TCG Counters tokens"]),
    // The Werewolves': the Seer, the Werewolf, the Mayor, the Alpha Wolf and the Witch, in their sides' colours
    werewolf: await ownStrip([[["Vidente", "Seer"], "lorc/crystal-ball", "#2f86e0"], [["Hombre lobo", "Werewolf"], "lorc/werewolf", "#b3191e"], [["Alcalde", "Mayor"], "delapouite/star-medal", "#d4a72c"], [["Lobo alfa", "Alpha Wolf"], "lorc/wolf-head", "#b3191e"], [["Bruja", "Witch"], "lorc/cauldron", "#2f86e0"]], ["Fichas de Hombres lobo", "Werewolves tokens"]),
  };
}

const ART = { es: await art("es"), en: await art("en") };
for (const [lang, a] of Object.entries(ART)) document.querySelector("#out").insertAdjacentHTML("beforeend", Object.values(a).map((svg) => `<div>${svg}</div>`).join(""));
window.__art = ART;
document.body.dataset.done = "1";
</script>
</body>
</html>
